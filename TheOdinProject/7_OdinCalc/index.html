
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OdinCalc</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="flex">
    <div class="borda fundoCalc flex">
      <div class="borda conteinerDisplay flex conteiner margem">
        <div class="borda displayCalc conteiner margem"></div>
      </div>

      <div class="borda conteinerTeclas conteiner">
        <div class="borda clear margem">Limpar display</div>
        <ul class="borda conteinerNum flex margem">
          <li class="borda tecla">7</li>
          <li class="borda tecla">8</li>
          <li class="borda tecla">9</li>
          <li class="borda tecla">+</li>
          <li class="borda tecla">4</li>
          <li class="borda tecla">5</li>
          <li class="borda tecla">6</li>
          <li class="borda tecla">-</li>
          <li class="borda tecla">1</li>
          <li class="borda tecla">2</li>
          <li class="borda tecla">3</li>
          <li class="borda tecla">*</li>
          <div class="borda margem tecla zero">0</div>
          <li class="borda tecla">/</li>
        </ul>
      </div>
    </div>
  </body>
</html>
