
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OdinCalc</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="flex centraliza">
    <div class="borda fundoCalc flex centraliza">
      <div class="borda conteinerDisplay flex conteiner">
        <div class="borda displayCalc conteiner margem"></div>
      </div>

      <div class="borda conteinerTeclas conteiner">
        <div class="borda margem">
          <div class="borda clear margem flex centraliza">Limpar</div>
          <ul class="conteinerNum flex margem">
            <li class="borda tecla flex centraliza">7</li>
            <li class="borda tecla flex centraliza">8</li>
            <li class="borda tecla flex centraliza">9</li>
            <li class="borda tecla flex centraliza">+</li>
            <li class="borda tecla flex centraliza">4</li>
            <li class="borda tecla flex centraliza">5</li>
            <li class="borda tecla flex centraliza">6</li>
            <li class="borda tecla flex centraliza">-</li>
            <li class="borda tecla flex centraliza">1</li>
            <li class="borda tecla flex centraliza">2</li>
            <li class="borda tecla flex centraliza">3</li>
            <li class="borda tecla flex centraliza">*</li>
            <div class="borda margem tecla zero flex centraliza">0</div>
          <li class="borda tecla flex centraliza">/</li>
        </ul>
        </div>
      </div>
    </div>
  </body>
</html>
