
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OdinCalc</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="flex centraliza">
    <div class="borda fundoCalc flex centraliza cinza">
      <div class="borda conteinerDisplay flex conteiner cinzaEsc">
        <div class="borda displayCalc conteiner margem cinza flex centraliza"></div>
      </div>

      <div class="borda conteiner cinzaEsc flex centraliza">
        <div class="borda conteinerNum flex margem cinza">
          <!-- <div class="borda tecla clear flex centraliza">Limpar</div> -->
          <button class="tecla clear flex centraliza">Limpar</button>
          <button class="tecla flex centraliza">7</button>
          <button class="tecla flex centraliza">8</button>
          <button class="tecla flex centraliza">9</button>
          <button class="tecla flex centraliza">4</button>
          <button class="tecla flex centraliza">5</button>
          <button class="tecla flex centraliza">6</button>
          <button class="tecla flex centraliza">1</button>
          <button class="tecla flex centraliza">2</button>
          <button class="tecla flex centraliza">3</button>
          <button class="tecla margem zero flex centraliza">0</button>
        </div>

        <div class="conteiner conteinerOperadores flex centraliza cinzaEsc">
          <div class="borda margem cinza operadores">
            <button class="tecla flex centraliza">+</button>
            <button class="tecla flex centraliza">-</button>
            <button class="tecla flex centraliza">*</button>
            <button class="tecla flex centraliza">/</button>
          </div>
          <div class="borda margem cinza conteinerIgual">
            <button class="tecla flex centraliza igual">=</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
